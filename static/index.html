<!doctype html>
<html>

  <link rel="stylesheet" href="/app.css" />
</head>

      <span id="status">—</span>

  </header>

  <main>
    <section>
      <h2>Agents</h2>
      <div id="agents" class="agents"></div>

    <section>
      <h2>Kanban</h2>
      <div class="kanban" id="kanban"></div>
    </section>

    <section>
      <h2>Cron (as cards)</h2>
      <div id="cron" class="cron"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
