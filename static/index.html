<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mission Control</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header>
    <h1>Mission Control</h1>
    <div class="header-right">
      <form id="logoutForm" method="post" action="/logout"><button>Logout</button></form>
      <span id="status">—</span>
    </div>
  </header>

  <main>
    <section>
      <div class="section-header">
        <h2>Agents</h2>
        <div class="view-toggle" id="agentViewToggle">
          <button class="toggle-btn active" data-view="root-only">Root Only</button>
          <button class="toggle-btn" data-view="all">All Agents</button>
        </div>
      </div>
      <div id="agents" class="agents-tree"></div>
    </section>

    <section>
      <h2>Kanban</h2>
      <div class="kanban" id="kanban"></div>
    </section>

    <section>
      <h2>Cron (as cards)</h2>
      <div id="cron" class="cron"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
